---
pi_hostname: "nil"
home_dir: "/home/{{ vault_pi_user }}"
svc_dir: "/home/{{ vault_pi_user }}/svc"
docker_gid: 985

stacks:
  - name: ingress
    profile: prod
    caddy: true
    subdomains:
      - host: tkozakas.online
        service: http://caddy:80
      - host: tkozakas.com
        service: http://caddy:80
  - name: sea-battle
    profile: prod
    deploy: true
    caddy: true
    subdomains:
      - host: sea-battle-api.tkozakas.online
        service: http://caddy:80
        tunnel: sea-battle
      - host: sea-battle-api.tkozakas.com
        service: http://caddy:80
        tunnel: sea-battle
  - name: got
    profile: prod
    deploy: true
  - name: gh-stats
    profile: prod
    deploy: true
    caddy: true
    subdomains:
      - host: ghstats.fun
        service: http://caddy:80
        tunnel: ghstats
  - name: githuber
    profile: prod
    deploy: true
  - name: pimon
    profile: prod
    deploy: true
  - name: jarvis
    profile: prod
    deploy: true
  - name: executor
    profile: prod
    deploy: true
  - name: streamtower
    profile: prod
    deploy: true
    subdomains:
      - host: streamtower.tkozakas.online
        service: http://streamtower:80
      - host: jackett.tkozakas.online
        service: http://jackett:9117
      - host: streamtower.tkozakas.com
        service: http://streamtower:80
      - host: jackett.tkozakas.com
        service: http://jackett:9117
  - name: hexwave
    profile: prod
    deploy: true
  - name: wordforge
    profile: prod
    deploy: true
  - name: arcade
    profile: prod
    deploy: true
    subdomains:
      - host: arcade.tkozakas.online
        service: http://arcade-arcade-1:8080
      - host: arcade.tkozakas.com
        service: http://arcade-arcade-1:8080
  - name: lebedev-cut
    profile: prod
    deploy: true
    subdomains:
      - host: lebedev-cut.tkozakas.online
        service: http://lebedev-cut-lebedev-cut-1:8080
      - host: lebedev-cut2.tkozakas.online
        service: http://lebedev-cut-lebedev-cut-1:8080
      - host: lebedev-cut.tkozakas.com
        service: http://lebedev-cut-lebedev-cut-1:8080
      - host: lebedev-cut2.tkozakas.com
        service: http://lebedev-cut-lebedev-cut-1:8080
      - host: lebedev-cut-console.tkozakas.com
        service: http://lebedev-cut-lebedev-cut-1:8081

subdomain_tunnel: tkozakas

retired_subdomains:
  - hexwave.tkozakas.online
  - wordforge.tkozakas.online
  - sea-battle.tkozakas.online
