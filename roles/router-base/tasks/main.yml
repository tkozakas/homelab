- name: Set hostname
  raw: uci set system.@system[0].hostname='{{ router_hostname }}'

- name: Set timezone
  raw: |
    uci set system.@system[0].timezone='{{ timezone }}'
    uci set system.@system[0].zonename='{{ timezone_name }}'

- name: Commit system config
  raw: uci commit system

- name: Set WAN DNS
  raw: |
    uci set network.wan.peerdns='{{ wan_peerdns }}'
    uci set network.wan.dns='{{ wan_dns }}'
    uci set network.wan.metric='{{ wan_metric }}'
  notify: Reload network

- name: Enable packet steering (use all CPU cores for network IRQs)
  raw: uci set network.globals.packet_steering='{{ packet_steering | default("1") }}'
  notify: Reload network

- name: Commit network config
  raw: uci commit network

- name: Enable flow offloading (SW + HW NAT where supported)
  raw: |
    uci set firewall.@defaults[0].flow_offloading='{{ flow_offloading | default("1") }}'
    uci set firewall.@defaults[0].flow_offloading_hw='{{ flow_offloading_hw | default("1") }}'
  notify: Reload firewall

- name: Commit firewall config
  raw: uci commit firewall
