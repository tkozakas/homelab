services:
  pimon:
    profiles: ["prod"]
    image: ghcr.io/tkozakas/pimon:main
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - INTERVAL=${INTERVAL:-60}
      - HOST_LABEL=${HOST_LABEL:-pi}
      - DEPLOY_TOKEN=${DEPLOY_TOKEN:-}
      - GHCR_TOKEN=${GHCR_TOKEN:-}
      - DEPLOY_URL=${DEPLOY_URL:-}
      - ROUTER_CHECK=${ROUTER_CHECK:-192.168.8.1:53}
      - WAN_CHECK=${WAN_CHECK:-1.1.1.1:443}
      - ADGUARD_URL=${ADGUARD_URL:-}
      - HEARTBEAT_URL=${HEARTBEAT_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/state/state.json')<300 else 1)"]
      interval: 60s
      start_period: 120s
    restart: unless-stopped

volumes:
  state:
