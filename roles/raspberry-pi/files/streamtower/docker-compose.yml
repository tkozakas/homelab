x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  torrserver:
    logging: *logging
    profiles: ["prod"]
    image: ghcr.io/yourok/torrserver:latest
    expose:
      - "8090"
    environment:
      - TS_PORT=8090
      - TS_CONF_PATH=/opt/ts/config
      - TS_TORRDIR=/opt/ts/cache
      - TS_DONTKILL=1
      - GOMAXPROCS=2
    volumes:
      - ${DATA_DIR:-/srv/streamtower}/config:/opt/ts/config
      - ${CACHE_DIR:-/srv/streamtower/cache}:/opt/ts/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/echo"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  jackett:
    logging: *logging
    profiles: ["prod"]
    image: lscr.io/linuxserver/jackett:latest
    expose:
      - "9117"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - AUTO_UPDATE=false
    volumes:
      - ${JACKETT_CONFIG_DIR:-/srv/streamtower/jackett}:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9117/UI/Login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  player:
    logging: *logging
    profiles: ["prod"]
    image: ghcr.io/tkozakas/streamtower:main
    expose:
      - "80"
    environment:
      - TORRSERVER_URL=http://torrserver:8090
      - JACKETT_URL=http://jackett:9117
      - JACKETT_CONFIG_FILE=/jackett/Jackett/ServerConfig.json
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - JACKETT_INDEXERS=${JACKETT_INDEXERS:-}
      - SEARCH_TIMEOUT=${SEARCH_TIMEOUT:-}
      - CACHE_SIZE=${CACHE_SIZE:-268435456}
      - READ_AHEAD_PERCENT=${READ_AHEAD_PERCENT:-}
      - PRELOAD_BUFFER_BYTES=${PRELOAD_BUFFER_BYTES:-}
      - PEER_CONNECTIONS=${PEER_CONNECTIONS:-}
      - DHT_CONNECTIONS=${DHT_CONNECTIONS:-}
      - UPLOAD_RATE_LIMIT=${UPLOAD_RATE_LIMIT:-}
      - DOWNLOAD_RATE_LIMIT=${DOWNLOAD_RATE_LIMIT:-}
      - TORRENT_DISCONNECT_SECONDS=${TORRENT_DISCONNECT_SECONDS:-}
      - CATALOG_TTL=${CATALOG_TTL:-}
      - SEARCH_TTL=${SEARCH_TTL:-}
      - POSTER_TTL=${POSTER_TTL:-}
      - META_DIR=/meta
      - META_CACHE_BYTES=${META_CACHE_BYTES:-}
      - TRANSCODE_JOBS=${TRANSCODE_JOBS:-1}
      - GOMEMLIMIT=${GOMEMLIMIT:-192MiB}
      - GOMAXPROCS=${GOMAXPROCS:-2}
      - TS_AUTH_USER=${TS_AUTH_USER:-}
      - TS_AUTH_PASS=${TS_AUTH_PASS:-}
    volumes:
      - ${JACKETT_CONFIG_DIR:-/srv/streamtower/jackett}:/jackett:ro
      - ${META_DIR:-/srv/streamtower/meta}:/meta
    devices:
      - ${V4L2_ENCODER:-/dev/null}:${V4L2_ENCODER:-/dev/null}
    depends_on:
      torrserver:
        condition: service_started
      jackett:
        condition: service_started
    networks:
      default: {}
      ingress:
        aliases: [streamtower]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  ingress:
    external: true
