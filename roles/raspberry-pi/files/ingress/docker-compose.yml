services:
  caddy:
    profiles: ["prod"]
    image: caddy:alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default
      - ingress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:80"]
      interval: 60s
    restart: unless-stopped

  webhook:
    profiles: ["prod"]
    image: almir/webhook:latest
    volumes:
      - ./deploy/hooks.json:/etc/webhook/hooks.json:ro
      - ./deploy/deploy.sh:/scripts/deploy.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/bin/docker:/usr/local/bin/docker:ro
      - ./deploy/bin/docker-compose:/usr/local/lib/docker/cli-plugins/docker-compose:ro
      - ${SVC_DIR}:${SVC_DIR}:ro
      - ${DOCKER_AUTH}:/etc/docker-auth:ro
    group_add:
      - "${DOCKER_GID}"
    environment:
      - DEPLOY_TOKEN=${DEPLOY_TOKEN}
      - DEPLOY_TOKEN_SEA_BATTLE=${DEPLOY_TOKEN_SEA_BATTLE}
      - DEPLOY_TOKEN_GOT=${DEPLOY_TOKEN_GOT}
      - DEPLOY_TOKEN_SAUKTINIAI=${DEPLOY_TOKEN_SAUKTINIAI}
      - DEPLOY_TOKEN_GH_STATS=${DEPLOY_TOKEN_GH_STATS}
      - DEPLOY_TOKEN_GITHUBER=${DEPLOY_TOKEN_GITHUBER}
      - DEPLOY_TOKEN_PIMON=${DEPLOY_TOKEN_PIMON}
      - DOCKER_CONFIG=/etc/docker-auth
    command: ["-verbose", "-template", "-hooks=/etc/webhook/hooks.json", "-hotreload"]
    restart: unless-stopped

  hooks-tunnel:
    profiles: ["prod"]
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${HOOKS_TUNNEL_TOKEN}
    depends_on:
      - caddy
    restart: unless-stopped

networks:
  ingress:
    external: true
