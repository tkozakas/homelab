x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  copilot:
    logging: *logging
    profiles: ["prod"]
    image: node:22-alpine
    command: sh -c "npx copilot-api@latest start --port 4141"
    volumes:
      - copilot-data:/root/.local/share
    restart: unless-stopped

  jarvis:
    logging: *logging
    profiles: ["prod"]
    image: ghcr.io/tkozakas/jarvis:main
    depends_on:
      - copilot
      - docker-proxy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ghcr.io/tkozakas/jarvis-sandbox:main}
      - SANDBOX_NETWORK=${SANDBOX_NETWORK:-jarvis_default}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-3600}
      - WATCHDOG_INTERVAL=${WATCHDOG_INTERVAL:-900}
      - WATCHDOG_MAX_RESTARTS=${WATCHDOG_MAX_RESTARTS:-2}
      - WATCHDOG_SUBDOMAINS=${WATCHDOG_SUBDOMAINS:-}
      - GH_TOKEN=${GH_TOKEN}
      - SANDBOX_GH_TOKEN=${SANDBOX_GH_TOKEN}
      - GHCR_TOKEN=${GHCR_TOKEN}
      - GH_OWNER=${GH_OWNER}
      - DEPLOY_TOKEN=${DEPLOY_TOKEN}
      - HOOKS_BASE=${HOOKS_BASE}
      - EXECUTOR_TOKEN=${EXECUTOR_TOKEN}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - state:/state
    networks:
      - default
      - ingress
    restart: unless-stopped

  docker-proxy:
    logging: *logging
    profiles: ["prod"]
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - PING=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  copilot-data:
  state:

networks:
  ingress:
    external: true
