x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lebedev-cut:
    logging: *logging
    profiles: ["prod"]
    image: ghcr.io/tkozakas/lebedev-cut:main
    environment:
      - CONTENT_DIR=/data
      - CONSOLE_USER=${CONSOLE_USER}
      - CONSOLE_PASSWORD=${CONSOLE_PASSWORD}
      - CONSOLE_SECRET=${CONSOLE_SECRET}
    expose:
      - "8080"
      - "8081"
    volumes:
      - content:/data
    networks:
      default:
      ingress:
        aliases: [lebedev-cut]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  content:

networks:
  ingress:
    external: true
