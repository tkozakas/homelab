x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lebedev-cut:
    logging: *logging
    profiles: ["prod"]
    image: ghcr.io/tkozakas/lebedev-cut:main
    expose:
      - "8080"
    networks:
      default:
      ingress:
        aliases: [lebedev-cut]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  ingress:
    external: true
