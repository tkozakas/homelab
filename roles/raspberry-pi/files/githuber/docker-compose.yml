services:
  githuber:
    profiles: ["prod"]
    image: ghcr.io/tkozakas/githuber:main
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL=${SLACK_CHANNEL}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - WEBHOOK_PORT=${WEBHOOK_PORT:-8080}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    volumes:
      - state:/state
    networks:
      - default
      - ingress
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/state/state.json')<300 else 1)"]
      interval: 60s
      start_period: 120s
    restart: unless-stopped

volumes:
  state:

networks:
  ingress:
    external: true
