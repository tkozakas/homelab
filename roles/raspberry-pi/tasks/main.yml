---
- name: Read docker group id
  getent:
    database: group
    key: docker

- name: Ensure ingress network exists
  shell: docker network inspect ingress >/dev/null 2>&1 || docker network create ingress
  register: ingress_network
  changed_when: ingress_network.stdout != ""


- name: Ensure svc directories exist
  file:
    path: "{{ svc_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ stacks }}"

- name: Ensure ingress deploy directory exists
  file:
    path: "{{ svc_dir }}/ingress/deploy"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy docker-compose files
  copy:
    src: "{{ item.name }}/docker-compose.yml"
    dest: "{{ svc_dir }}/{{ item.name }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ stacks }}"

- name: Deploy Caddyfiles
  copy:
    src: "{{ item.name }}/Caddyfile"
    dest: "{{ svc_dir }}/{{ item.name }}/Caddyfile"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ stacks }}"
  when: item.caddy | default(false)

- name: Deploy webhook script
  copy:
    src: "ingress/deploy/deploy.sh"
    dest: "{{ svc_dir }}/ingress/deploy/deploy.sh"
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy webhook hooks
  template:
    src: hooks.json.j2
    dest: "{{ svc_dir }}/ingress/deploy/hooks.json"
    owner: "{{ ansible_user }}"
    mode: "0644"

- name: Install static docker cli for webhook
  shell: |
    set -e
    curl -fsSL https://download.docker.com/linux/static/stable/{{ ansible_architecture }}/docker-{{ docker_cli_version }}.tgz | tar -xz -C /tmp docker/docker
    install -D -o {{ ansible_user }} /tmp/docker/docker {{ svc_dir }}/ingress/deploy/bin/docker
    curl -fsSL -o {{ svc_dir }}/ingress/deploy/bin/docker-compose https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-{{ ansible_architecture }}
    chown {{ ansible_user }} {{ svc_dir }}/ingress/deploy/bin/docker-compose
    chmod 755 {{ svc_dir }}/ingress/deploy/bin/docker-compose
  args:
    creates: "{{ svc_dir }}/ingress/deploy/bin/docker-compose"

- name: Ensure backups directory exists
  file:
    path: "{{ svc_dir | dirname }}/backups"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy backup script
  template:
    src: backup.sh.j2
    dest: /usr/local/bin/homelab-backup
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Schedule nightly volume backups
  cron:
    name: homelab-backup
    user: "{{ ansible_user }}"
    minute: "30"
    hour: "3"
    job: "/usr/local/bin/homelab-backup >> {{ svc_dir | dirname }}/backups/backup.log 2>&1"


- name: Deploy .env files from vault
  template:
    src: "{{ item.name }}.env.j2"
    dest: "{{ svc_dir }}/{{ item.name }}/.env"
    owner: "{{ ansible_user }}"
    mode: "0600"
  loop: "{{ stacks }}"

- name: Start stacks
  shell: docker compose --profile {{ item.profile }} up -d
  args:
    chdir: "{{ svc_dir }}/{{ item.name }}"
  loop: "{{ stacks }}"
  register: stack_results
  changed_when: "'Started' in stack_results.stderr or 'Created' in stack_results.stderr"
