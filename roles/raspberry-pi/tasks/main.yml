---
- name: Read docker group id
  getent:
    database: group
    key: docker

- name: Ensure ingress network exists
  shell: docker network inspect ingress >/dev/null 2>&1 || docker network create ingress
  register: ingress_network
  changed_when: ingress_network.stdout != ""


- name: Ensure svc directories exist
  file:
    path: "{{ svc_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ stacks }}"

- name: Ensure gh-stats deploy directory exists
  file:
    path: "{{ svc_dir }}/gh-stats/deploy"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy docker-compose files
  copy:
    src: "{{ item.name }}/docker-compose.yml"
    dest: "{{ svc_dir }}/{{ item.name }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ stacks }}"

- name: Deploy Caddyfiles
  copy:
    src: "{{ item.name }}/Caddyfile"
    dest: "{{ svc_dir }}/{{ item.name }}/Caddyfile"
    owner: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ stacks }}"
  when: item.name not in ['got', 'githuber', 'pimon']

- name: Deploy webhook script
  copy:
    src: "gh-stats/deploy/deploy.sh"
    dest: "{{ svc_dir }}/gh-stats/deploy/deploy.sh"
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy webhook hooks
  template:
    src: hooks.json.j2
    dest: "{{ svc_dir }}/gh-stats/deploy/hooks.json"
    owner: "{{ ansible_user }}"
    mode: "0644"

- name: Install static docker cli for webhook
  shell: |
    set -e
    curl -fsSL https://download.docker.com/linux/static/stable/aarch64/docker-27.5.1.tgz | tar -xz -C /tmp docker/docker
    install -D -o {{ ansible_user }} /tmp/docker/docker {{ svc_dir }}/gh-stats/deploy/bin/docker
    curl -fsSL -o {{ svc_dir }}/gh-stats/deploy/bin/docker-compose https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-aarch64
    chown {{ ansible_user }} {{ svc_dir }}/gh-stats/deploy/bin/docker-compose
    chmod 755 {{ svc_dir }}/gh-stats/deploy/bin/docker-compose
  args:
    creates: "{{ svc_dir }}/gh-stats/deploy/bin/docker-compose"


- name: Deploy .env files from vault
  template:
    src: "{{ item.name }}.env.j2"
    dest: "{{ svc_dir }}/{{ item.name }}/.env"
    owner: "{{ ansible_user }}"
    mode: "0600"
  loop: "{{ stacks }}"

- name: Start stacks
  shell: docker compose --profile {{ item.profile }} up -d
  args:
    chdir: "{{ svc_dir }}/{{ item.name }}"
  loop: "{{ stacks }}"
  register: stack_results
  changed_when: "'Started' in stack_results.stderr or 'Created' in stack_results.stderr"
